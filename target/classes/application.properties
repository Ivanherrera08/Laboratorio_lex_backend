spring.application.name=Laboratorio_lex

# ==============================================================================
# CONFIGURACIÓN DE CONEXIÓN POSTGRESQL (ZONE CONTROL)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/zone_control_db?currentSchema=zone_control,public
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=zone_control

# ==============================================================================
# MIGRACIONES FLYWAY AUTOMÁTICAS
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://127.0.0.1:5433/zone_control_db?currentSchema=zone_control,public
spring.flyway.user=devuser
spring.flyway.password=devpassword
spring.flyway.schemas=zone_control
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# ==============================================================================
# CONFIGURACIÓN DEL SERVIDOR WEB SPRING BOOT
# ==============================================================================
server.port=8080
server.servlet.context-path=/
